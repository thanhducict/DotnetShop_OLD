name: Deploy to Azure App Service

on:
  push:
    branches: [ 'master' ]

env:
  AZURE_WEBAPP_NAME: dotnetshop
  AZURE_WEBAPP_PACKAGE_PATH: '.'

jobs:
  build:
    name: Build .NET and NodeJS
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up NodeJS
      uses: actions/setup-node@v3
      with:
        node-version: 16
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
    - name: Install node_modules
      run: yarn install --frozen-lockfile
      working-directory: DotnetShop.WebClient/ClientApp
    - name: Build WebClient
      run: yarn build:release
      working-directory: DotnetShop.WebClient/ClientApp
    - name: Restore dependencies
      run: dotnet restore DotnetShop.sln --configfile nuget.config
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Publish
      run: dotnet publish -c Release -o '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/myapp'
    - name: Deploy
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.DOTNETSHOP_PUBLISH_PROFILE }}
